name: Multi-Part Fast Downloader

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "HTTP or HTTPS target URL"
        required: true
      concurrency:
        description: "Concurrent connections (workers)"
        required: false
        default: "32"
      chunk_size:
        description: "Chunk Size (e.g. 8MB, 16MB)"
        required: false
        default: "8MB"
      output_filename:
        description: "Custom output filename (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  download:
    name: High-Speed Multi-Part Download (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Download Engine (Linux)
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w" -o ./bin/dlengine ./cmd/dlengine
          chmod +x ./bin/dlengine

      - name: Execute Fast Multi-Part Download
        shell: bash
        env:
          DL_URL: ${{ inputs.download_url }}
          DL_CONCURRENCY: ${{ inputs.concurrency }}
          DL_CHUNK_SIZE: ${{ inputs.chunk_size }}
          DL_OUTPUT: ${{ inputs.output_filename }}
        run: |
          set -euo pipefail
          [[ "$DL_CONCURRENCY" =~ ^[1-9][0-9]*$ ]] || { echo "concurrency must be a positive integer" >&2; exit 1; }
          [[ "$DL_CHUNK_SIZE" =~ ^[1-9][0-9]*(KB|MB|GB)$ ]] || { echo "chunk_size must look like 8MB" >&2; exit 1; }
          [[ "$DL_URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "download_url must be an HTTP(S) URL without whitespace" >&2; exit 1; }

          args=(-u "$DL_URL" -c "$DL_CONCURRENCY" -s "$DL_CHUNK_SIZE")
          if [ -n "$DL_OUTPUT" ]; then
            if [[ "$DL_OUTPUT" == */* ]] || [[ "$DL_OUTPUT" == .* ]]; then
              echo "output_filename must be a plain filename" >&2
              exit 1
            fi
            args+=(-o "$DL_OUTPUT")
          fi

          printf 'Running ./bin/dlengine with %d arguments\n' "${#args[@]}"
          ./bin/dlengine "${args[@]}"

      - name: List Downloaded Files
        run: |
          ls -lh
